[workspace]
name = "mojo-amx-internal"
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
max = "*"
python = ">=3.11"

[tasks]
test = { depends-on = ["test-all"] }
test-all = { depends-on = ["test-exp", "test-log", "test-sincos"] }
test-exp = "mojo run simd_math/tests/test_exp.mojo"
test-log = "mojo run simd_math/tests/test_log.mojo"
test-sincos = "mojo run simd_math/tests/test_sincos.mojo -Xlinker -lm"
bench-exp = "mojo run -O3 simd_math/tests/bench_exp.mojo"
